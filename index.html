    <script>
      (function() {
        const isBenign = function(msg) {
          if (!msg) return true;
          const s = String(msg);
          return s === 'Script error.' || s.includes('Script error') || s.includes('[vite]') || s.includes('websocket');
        };

        window.addEventListener('error', function(e) {
          if (!e.filename || isBenign(e.message)) {
            e.preventDefault && e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (e.reason && isBenign(e.reason.message || e.reason)) {
            e.preventDefault && e.preventDefault();
          }
        });

        const origWarn = console.warn;
        console.warn = function(...args) {
          if (args.some(arg => isBenign(arg))) return;
          origWarn.apply(console, args);
        };

        const origError = console.error;
        console.error = function(...args) {
          if (args.some(arg => isBenign(arg))) return;
          origError.apply(console, args);
        };
      })();
    </script>

  <body class="antialiased selection:bg-[#DDD8D0] selection:text-[#2A241E]">
    <div id="root"></div>
    <div class="cursor-light"></div>
    <style>
    /* إضاءة الماوس الثلاثية الأبعاد بتصميم Apple Glassmorphic */
    .cursor-light {
      position: fixed;
      top: 0;
      left: 0;
      width: 400px;
      height: 400px;
      pointer-events: none;
      background: radial-gradient(
        circle,
        rgba(56, 189, 248, 0.15) 0%,
        rgba(14, 165, 233, 0.05) 40%,
        transparent 70%
      );
      border-radius: 50%;
      transform: translate(-50%, -50%);
      z-index: 9999;
      mix-blend-mode: screen;
      transition: width 0.3s ease, height 0.3s ease;
    }
    </style>
    <script>
    // حركة ناعمة جداً باستخدام الإحداثيات والـ LERP
    window.addEventListener('DOMContentLoaded', () => {
      const cursorLight = document.querySelector('.cursor-light');
      if (!cursorLight) return;

      let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
      let pos = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
      const speed = 0.1;

      window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
      });

      function update() {
        pos.x += (mouse.x - pos.x) * speed;
        pos.y += (mouse.y - pos.y) * speed;

        cursorLight.style.transform = `translate(${pos.x}px, ${pos.y}px) translate(-50%, -50%)`;

        requestAnimationFrame(update);
      }

      update();
    });
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
